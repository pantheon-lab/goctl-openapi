name: Auto Version

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: auto-version
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.next.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Test
        run: go test ./... -count=1

      - name: Compute next version
        id: next
        run: |
          tag=$(bash .github/scripts/next-version.sh)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ -n "$tag" ]; then
            echo "Next version: $tag" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No feat/fix/perf/refactor/breaking commits since the last tag; skipping release." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Push tag
        if: steps.next.outputs.tag != ''
        env:
          TAG: ${{ steps.next.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG"
          git push origin "$TAG"

  release:
    needs: tag
    if: needs.tag.outputs.tag != ''
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
    permissions:
      contents: write
    secrets: inherit
