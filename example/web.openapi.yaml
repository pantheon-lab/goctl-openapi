components:
  schemas:
    AgentLocation:
      type: object
      title: AgentLocation
      properties:
        agentId:
          type: string
        location:
          type: string
      required:
        - location
        - agentId
    AttachmentDto:
      type: object
      title: AttachmentDto
      properties:
        payload:
          $ref: '#/components/schemas/PayloadDto'
        type:
          type: string
      required:
        - type
        - payload
    AudioVoice:
      type: object
      title: AudioVoice
      properties:
        gender:
          type: string
        language:
          type: string
        name:
          type: string
        voice_id:
          type: string
      required:
        - voice_id
        - name
        - gender
        - language
    AuthorizedReq:
      type: object
      title: AuthorizedReq
      properties:
        code:
          type: string
        state:
          type: string
      required:
        - code
        - state
    AvatarAction:
      type: object
      title: AvatarAction
      properties:
        actions:
          type: array
          items:
            type: string
        model_id:
          type: string
      required:
        - model_id
        - actions
    AvatarActions:
      type: object
      title: AvatarActions
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AvatarAction'
      required:
        - data
    AzureSttWebsocketLangReq:
      type: object
      title: AzureSttWebsocketLangReq
    Bathroom:
      type: object
      title: Bathroom
      properties:
        bathrooms:
          type: string
          nullable: true
        original:
          type: string
          nullable: true
        range:
          type: string
          nullable: true
    Bedroom:
      type: object
      title: Bedroom
      properties:
        bedrooms:
          type: string
          nullable: true
        original:
          type: string
          nullable: true
        range:
          type: string
          nullable: true
    BldgAge:
      type: object
      title: BldgAge
      properties:
        bldg_age:
          type: string
          nullable: true
        original:
          type: string
          nullable: true
        range:
          type: string
          default: Equal
    ButtonDto:
      type: object
      title: ButtonDto
      properties:
        payload:
          type: string
        title:
          type: string
        type:
          type: string
        url:
          type: string
      required:
        - type
    CarouselDetailDto:
      type: object
      title: CarouselDetailDto
      properties:
        contact:
          type: string
        keywords:
          type: string
        lang:
          type: string
        shopName:
          type: string
        tags:
          type: array
          items:
            type: string
    CarouselDto:
